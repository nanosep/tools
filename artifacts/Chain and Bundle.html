<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Pack/Bundle/Inception Generator</title>
    <style>
        :root {
            --bg-main: #0a0b0f;
            --bg-secondary: #14161f;
            --bg-tertiary: #1d202e;
            --text-primary: #e6e8f0;
            --text-secondary: #a0a4b8;
            --accent-blue: #3ba4ff;
            --accent-purple: #9d4edd;
            --accent-green: #00d16f;
            --accent-orange: #ff8400;
            --accent-red: #ff4f5e;
            --border-color: #2a2e3d;
            --code-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .input-section {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        textarea, select {
            width: 100%;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 12px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 20px;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 164, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .output-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-container {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 15px;
            background-color: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }

        .output-header:hover {
            background-color: #252938;
        }

        .output-title {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .output-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-chain { background-color: var(--accent-blue); }
        .badge-bundle { background-color: var(--accent-purple); }
        .badge-inception { background-color: var(--accent-orange); }

        .collapse-icon {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .collapse-icon.active {
            transform: rotate(180deg);
        }

        .output-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .output-content.active {
            max-height: 5000px;
        }

        .prompt-card {
            background-color: var(--bg-tertiary);
            border-left: 3px solid var(--accent-green);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .prompt-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .technique-tag {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: rgba(0, 209, 111, 0.2);
            color: var(--accent-green);
            font-weight: 600;
        }

        .step-number {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .prompt-text {
            background-color: var(--code-bg);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .copy-btn {
            background: var(--accent-green);
            border: none;
            color: var(--bg-main);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: auto;
        }

        .copy-btn:hover {
            background: #00ff88;
            transform: translateY(-1px);
        }

        .copy-btn.copied {
            background: var(--accent-blue);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background-color: rgba(59, 164, 255, 0.1);
            border-left: 3px solid var(--accent-blue);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prompt Pack/Bundle/Inception Generator</h1>
        <p class="subtitle">Transform messy human input into structured, copy-paste ready prompts</p>

        <div class="input-section">
            <label for="userInput">Your Input (Goal, Task, or Question)</label>
            <textarea 
                id="userInput" 
                rows="6" 
                placeholder="Example: I need to develop a go-to-market strategy for a B2B SaaS product targeting mid-market financial services companies..."
            ></textarea>

            <div class="controls-grid">
                <div>
                    <label for="outputFormat">Output Format</label>
                    <select id="outputFormat">
                        <option value="markdown">Markdown</option>
                        <option value="prose">Prose</option>
                        <option value="json">JSON</option>
                    </select>
                </div>

                <div>
                    <label for="chainLength">Chain Length</label>
                    <select id="chainLength">
                        <option value="3">3 Steps</option>
                        <option value="4" selected>4 Steps</option>
                        <option value="5">5 Steps</option>
                    </select>
                </div>

                <div>
                    <label for="bundleSize">Bundle Size</label>
                    <select id="bundleSize">
                        <option value="3">3 Prompts</option>
                        <option value="4">4 Prompts</option>
                        <option value="5" selected>5 Prompts</option>
                    </select>
                </div>
            </div>

            <button onclick="generatePrompts()">Generate Prompts</button>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing input and generating optimized prompts...</p>
        </div>

        <div id="outputSection" class="output-section"></div>
    </div>

    <script>
        // 20 Core Techniques Database
        const techniques = {
            chainOfThought: {
                name: "Chain-of-Thought",
                trigger: ["reasoning", "analysis", "complex", "step", "logic", "why"],
                apply: (input, format) => `Let's think through this step by step.

${input}

Show your reasoning process explicitly before providing the final answer. Break down your thinking into clear, logical steps.`
            },
            fewShot: {
                name: "Few-Shot",
                trigger: ["example", "like", "similar", "format", "template"],
                apply: (input, format) => `${input}

Provide your response following these example patterns:

Example 1: [Relevant example]
Example 2: [Relevant example]
Example 3: [Relevant example]

Now apply this pattern to the task above.`
            },
            rolePrompting: {
                name: "Role Prompting",
                trigger: ["expert", "professional", "specialist", "consultant"],
                apply: (input, format) => `You are a world-class expert with 20+ years of experience in this domain.

${input}

Approach this with the depth, nuance, and practical wisdom that comes from extensive real-world experience.`
            },
            constraintBased: {
                name: "Constraint-Based",
                trigger: ["must", "cannot", "only", "exactly", "limit", "requirement"],
                apply: (input, format) => `${input}

CONSTRAINTS:
- Must be actionable and specific
- Cannot exceed 500 words
- Must include concrete metrics
- Output format: ${format}

Deliver within these exact parameters.`
            },
            socraticQuestioning: {
                name: "Socratic Questioning",
                trigger: ["understand", "explore", "discover", "learn", "clarify"],
                apply: (input, format) => `${input}

Before providing a solution, ask yourself these probing questions:
1. What assumptions am I making?
2. What would disprove this approach?
3. What am I not considering?
4. How would an expert challenge this?

Then provide your answer informed by this self-interrogation.`
            },
            treeOfThoughts: {
                name: "Tree-of-Thoughts",
                trigger: ["options", "alternatives", "possibilities", "scenarios", "paths"],
                apply: (input, format) => `${input}

Explore multiple distinct paths to solving this:

PATH A: [First approach]
PATH B: [Alternative approach]
PATH C: [Contrarian approach]

Evaluate trade-offs, then recommend the optimal path with justification.`
            },
            emotionalStimuli: {
                name: "Emotional Tipping",
                trigger: ["important", "critical", "urgent", "high-stakes", "crucial"],
                apply: (input, format) => `This is a high-stakes situation with significant consequences.

${input}

The quality of your response directly impacts critical outcomes. Bring your absolute best thinking to this challenge.`
            },
            perspectiveShifting: {
                name: "Perspective Shifting",
                trigger: ["different", "viewpoint", "angle", "lens", "perspective"],
                apply: (input, format) => `${input}

Analyze this from three distinct perspectives:

1. OPTIMIST VIEW: Best-case scenario and opportunities
2. PESSIMIST VIEW: Risks, obstacles, and failure modes  
3. REALIST VIEW: Balanced assessment with practical constraints

Synthesize insights from all three viewpoints.`
            },
            metacognitive: {
                name: "Metacognitive Monitoring",
                trigger: ["verify", "check", "validate", "accurate", "correct"],
                apply: (input, format) => `${input}

After generating your response, perform a metacognitive check:

CONFIDENCE LEVEL: [Low/Medium/High]
POTENTIAL BLIND SPOTS: [What might I be missing?]
VERIFICATION NEEDED: [What should be fact-checked?]
ALTERNATIVE INTERPRETATIONS: [What else could this mean?]

Include this self-assessment with your answer.`
            },
            contrastivePrompting: {
                name: "Contrastive Prompting",
                trigger: ["versus", "compare", "difference", "better", "instead"],
                apply: (input, format) => `${input}

Provide your recommendation by explicitly contrasting:

OPTION A: [First approach]
OPTION B: [Alternative approach]

Direct comparison across these dimensions:
- Effectiveness
- Resource requirements
- Risk profile
- Timeline
- Expected outcomes

Conclude with clear choice and rationale.`
            },
            selfConsistency: {
                name: "Self-Consistency",
                trigger: ["reliable", "consistent", "multiple", "verify", "confirm"],
                apply: (input, format) => `${input}

Generate 3 independent solutions to this problem using different reasoning approaches. Then identify common elements across all solutions - those represent the most reliable answer.

SOLUTION 1: [Approach A]
SOLUTION 2: [Approach B]  
SOLUTION 3: [Approach C]

CONSENSUS: [What all solutions agree on]`
            },
            structuredGeneration: {
                name: "Structured Generation",
                trigger: ["organize", "structure", "format", "framework", "systematic"],
                apply: (input, format) => `${input}

Provide your response in this exact structure:

${format === 'json' ? `{
  "summary": "...",
  "key_points": [...],
  "recommendations": [...],
  "next_steps": [...]
}` : format === 'markdown' ? `## Summary
[Overview]

## Key Points
- Point 1
- Point 2

## Recommendations
- Rec 1
- Rec 2

## Next Steps
1. Step 1
2. Step 2` : `SUMMARY: [Overview]

KEY POINTS: [Main insights]

RECOMMENDATIONS: [Specific actions]

NEXT STEPS: [Implementation plan]`}`
            },
            negativePrompting: {
                name: "Negative Prompting",
                trigger: ["avoid", "not", "don't", "exclude", "without"],
                apply: (input, format) => `${input}

DO NOT include:
- Generic advice or platitudes
- Vague recommendations
- Theoretical concepts without practical application
- Jargon without explanation

DO provide:
- Specific, actionable guidance
- Concrete examples
- Clear success criteria`
            },
            analogicalReasoning: {
                name: "Analogical Reasoning",
                trigger: ["like", "similar to", "analogy", "metaphor", "compare to"],
                apply: (input, format) => `${input}

Explain this concept through 2-3 powerful analogies that make it intuitive:

ANALOGY 1: [Familiar domain comparison]
ANALOGY 2: [Different perspective]

Then bridge back to the original problem with insights from these analogies.`
            },
            iterativeRefinement: {
                name: "Iterative Refinement",
                trigger: ["improve", "refine", "better", "optimize", "enhance"],
                apply: (input, format) => `${input}

DRAFT 1: Provide initial solution
CRITIQUE: Identify weaknesses in Draft 1
DRAFT 2: Improved version addressing critique
FINAL: Polished output incorporating all insights`
            },
            boundedCreativity: {
                name: "Bounded Creativity",
                trigger: ["creative", "innovative", "novel", "unique", "original"],
                apply: (input, format) => `${input}

Generate creative solutions within these boundaries:

CONSTRAINTS:
- Must be implementable within 90 days
- Cannot exceed reasonable budget
- Must use existing resources

CREATIVE LATITUDE:
- Novel combinations of existing elements
- Unconventional applications
- Cross-domain inspiration

Provide 3 creative-yet-feasible options.`
            },
            adversarialTesting: {
                name: "Adversarial Red-Teaming",
                trigger: ["challenge", "stress-test", "weakness", "failure", "risk"],
                apply: (input, format) => `${input}

Act as a hostile critic trying to find fatal flaws in this approach:

RED TEAM ANALYSIS:
- What breaks under pressure?
- What assumptions fail?
- What edge cases cause failure?
- What opponents would exploit?

Then provide a hardened solution that addresses these vulnerabilities.`
            },
            decomposition: {
                name: "Recursive Decomposition",
                trigger: ["complex", "breakdown", "components", "parts", "elements"],
                apply: (input, format) => `${input}

Break this down recursively:

LEVEL 1: Main components (3-5 pieces)
LEVEL 2: Sub-components of each piece
LEVEL 3: Granular elements

Then reassemble with clear dependencies and sequencing.`
            },
            syntaxFree: {
                name: "Syntax-Free Vectorization",
                trigger: ["tone", "style", "voice", "persona", "character"],
                apply: (input, format) => `${input}

Approach this with the following vectors:

TONE: [Professional | Casual | Academic]
DEPTH: [Surface | Moderate | Expert]
ENERGY: [Calm | Balanced | Urgent]
FRAMING: [Optimistic | Neutral | Critical]

Respond naturally embodying these parameters without explicitly stating them.`
            },
            dynamicTone: {
                name: "Dynamic Tone Morphing",
                trigger: ["progressive", "journey", "evolution", "transition", "flow"],
                apply: (input, format) => `${input}

Structure your response with progressive tone shifts:

PHASE 1 (Hook): Start accessible and engaging
PHASE 2 (Bridge): Transition to professional depth  
PHASE 3 (Deep Dive): End with expert-level precision

Make transitions fluid and natural.`
            }
        };

        function detectTechniques(input) {
            const inputLower = input.toLowerCase();
            const detected = [];
            
            for (const [key, technique] of Object.entries(techniques)) {
                const score = technique.trigger.filter(trigger => 
                    inputLower.includes(trigger)
                ).length;
                
                if (score > 0) {
                    detected.push({ key, technique, score });
                }
            }
            
            // Sort by relevance score and return top techniques
            return detected.sort((a, b) => b.score - a.score);
        }

        function generateChain(input, length, format) {
            const steps = [
                {
                    technique: "decomposition",
                    title: "Decompose & Analyze",
                    prompt: techniques.decomposition.apply(input, format)
                },
                {
                    technique: "perspectiveShifting",
                    title: "Multi-Perspective Analysis",
                    prompt: techniques.perspectiveShifting.apply("Based on the decomposition above, analyze this from multiple perspectives.", format)
                },
                {
                    technique: "contrastivePrompting",
                    title: "Evaluate Options",
                    prompt: techniques.contrastivePrompting.apply("Using insights from the previous analysis, compare and contrast the top 2-3 approaches.", format)
                },
                {
                    technique: "iterativeRefinement",
                    title: "Refine & Optimize",
                    prompt: techniques.iterativeRefinement.apply("Take the recommended approach and refine it into an actionable plan.", format)
                },
                {
                    technique: "adversarialTesting",
                    title: "Stress Test",
                    prompt: techniques.adversarialTesting.apply("Red-team the final plan to identify and address potential failure modes.", format)
                }
            ];
            
            return steps.slice(0, length);
        }

        function generateBundle(input, size, format) {
            const detectedTechs = detectTechniques(input);
            const bundle = [];
            
            // Always include core techniques
            const coreTechs = ['chainOfThought', 'rolePrompting', 'treeOfThoughts'];
            
            // Add detected techniques
            const selectedTechs = new Set(coreTechs);
            detectedTechs.forEach(dt => {
                if (selectedTechs.size < size) {
                    selectedTechs.add(dt.key);
                }
            });
            
            // Fill remaining slots with diverse techniques
            if (selectedTechs.size < size) {
                const remaining = Object.keys(techniques).filter(k => !selectedTechs.has(k));
                while (selectedTechs.size < size && remaining.length > 0) {
                    const randomIndex = Math.floor(Math.random() * remaining.length);
                    selectedTechs.add(remaining.splice(randomIndex, 1)[0]);
                }
            }
            
            // Generate prompts with descriptive context
            Array.from(selectedTechs).slice(0, size).forEach((techKey, index) => {
                const descriptions = {
                    chainOfThought: "Forces explicit step-by-step reasoning to improve logical consistency and transparency",
                    rolePrompting: "Leverages domain expertise persona to unlock deeper, more nuanced responses",
                    treeOfThoughts: "Explores multiple solution paths simultaneously before selecting optimal approach",
                    fewShot: "Uses concrete examples to establish pattern and desired output structure",
                    constraintBased: "Applies strict boundaries to focus output and ensure actionable deliverables",
                    socraticQuestioning: "Uses self-interrogation to challenge assumptions and reveal blind spots",
                    emotionalStimuli: "Raises stakes to trigger more careful, high-quality reasoning",
                    perspectiveShifting: "Analyzes from multiple viewpoints (optimist/pessimist/realist) for balanced insight",
                    metacognitive: "Includes self-assessment of confidence, limitations, and verification needs",
                    contrastivePrompting: "Forces direct comparison across options to highlight trade-offs and decision criteria",
                    selfConsistency: "Generates multiple independent solutions to identify most reliable consensus answer",
                    structuredGeneration: "Enforces specific output format for consistency and easy integration",
                    negativePrompting: "Explicitly excludes unwanted patterns to avoid generic or vague responses",
                    analogicalReasoning: "Explains through familiar analogies to build intuition and clarity",
                    iterativeRefinement: "Cycles through draft-critique-improve loop for polished final output",
                    boundedCreativity: "Balances innovation with practical constraints for implementable creative solutions",
                    adversarialTesting: "Red-teams the solution to identify vulnerabilities and strengthen approach",
                    decomposition: "Breaks complex problem into hierarchical components with clear dependencies",
                    syntaxFree: "Uses implicit parameters (tone/depth/energy) without rigid formatting",
                    dynamicTone: "Progressively shifts complexity from accessible to expert-level throughout response"
                };
                
                bundle.push({
                    technique: techKey,
                    name: techniques[techKey].name,
                    description: descriptions[techKey] || "Advanced prompting technique",
                    prompt: techniques[techKey].apply(input, format),
                    number: index + 1
                });
            });
            
            return bundle;
        }

        function generateInception(input, format, chainLength, bundleSize) {
            return {
                chain: `You are an expert prompt engineer specializing in sequential workflow design.

TASK: Create a ${chainLength}-step prompt chain for the following goal:

"${input}"

REQUIREMENTS:
- Each prompt should build logically on the previous output
- Use diverse prompting techniques (Chain-of-Thought, Tree-of-Thoughts, Contrastive Analysis, etc.)
- Make each prompt copy-paste ready
- Output format for each prompt: ${format}
- Flow should go from analysis → synthesis → decision → implementation → validation

Generate ${chainLength} numbered prompts with clear step labels.`,
                
                bundle: `You are an expert prompt engineer specializing in parallel prompt design.

TASK: Create ${bundleSize} independent prompts that approach this goal from different angles:

"${input}"

REQUIREMENTS:
- Each prompt uses a visibly different technique (e.g., Role Prompting, Socratic Questioning, Analogical Reasoning, Red-Teaming, etc.)
- All prompts address the same core goal but with different methodologies
- Make each prompt copy-paste ready
- Output format for each: ${format}
- Include technique name as a label for each prompt

Generate ${bundleSize} distinct prompts, each using a different advanced prompting technique.`
            };
        }

        async function generatePrompts() {
            const input = document.getElementById('userInput').value.trim();
            const format = document.getElementById('outputFormat').value;
            const chainLength = parseInt(document.getElementById('chainLength').value);
            const bundleSize = parseInt(document.getElementById('bundleSize').value);
            
            if (!input) {
                alert('Please enter your input first.');
                return;
            }
            
            // Show loading
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('outputSection').style.display = 'none';
            
            // Simulate processing time
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Generate all three outputs
            const chain = generateChain(input, chainLength, format);
            const bundle = generateBundle(input, bundleSize, format);
            const inception = generateInception(input, format, chainLength, bundleSize);
            
            // Render outputs
            renderOutputs(chain, bundle, inception);
            
            // Hide loading, show outputs
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('outputSection').style.display = 'block';
        }

        function renderOutputs(chain, bundle, inception) {
            const outputSection = document.getElementById('outputSection');
            
            outputSection.innerHTML = `
                <!-- Prompt Chain -->
                <div class="output-container">
                    <div class="output-header" onclick="toggleOutput(this)">
                        <div class="output-title">
                            <span class="output-badge badge-chain">Prompt Chain</span>
                            Sequential Execution Workflow
                        </div>
                        <span class="collapse-icon">▼</span>
                    </div>
                    <div class="output-content active">
                        <div class="info-box">
                            <strong>Execution:</strong> Run each prompt in sequence. Output from Prompt 1 → Input for Prompt 2, etc.
                        </div>
                        ${chain.map((step, i) => `
                            <div class="prompt-card">
                                <div class="prompt-header">
                                    <div>
                                        <div class="step-number">STEP ${i + 1}: ${step.title}</div>
                                        <div class="prompt-meta">
                                            <span class="technique-tag">${techniques[step.technique].name}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="prompt-text">${escapeHtml(step.prompt)}</div>
                                <button class="copy-btn" onclick="copyPrompt(this, ${i})">Copy Prompt</button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Prompt Bundle -->
                <div class="output-container">
                    <div class="output-header" onclick="toggleOutput(this)">
                        <div class="output-title">
                            <span class="output-badge badge-bundle">Prompt Bundle</span>
                            Parallel Alternative Approaches
                        </div>
                        <span class="collapse-icon">▼</span>
                    </div>
                    <div class="output-content active">
                        <div class="info-box">
                            <strong>Execution:</strong> Choose any prompt to execute independently. Each approaches the goal using a different technique.
                        </div>
                        ${bundle.map((item, i) => `
                            <div class="prompt-card">
                                <div class="prompt-header">
                                    <div style="flex: 1;">
                                        <div class="step-number">APPROACH ${item.number}: ${item.name}</div>
                                        <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 5px; line-height: 1.4;">
                                            ${item.description}
                                        </div>
                                        <div class="prompt-meta" style="margin-top: 8px;">
                                            <span class="technique-tag">${item.name}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="prompt-text">${escapeHtml(item.prompt)}</div>
                                <button class="copy-btn" onclick="copyPrompt(this, ${i + 100})">Copy Prompt</button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Prompt Inception -->
                <div class="output-container">
                    <div class="output-header" onclick="toggleOutput(this)">
                        <div class="output-title">
                            <span class="output-badge badge-inception">Prompt Inception</span>
                            Meta-Prompts (Generate Prompts)
                        </div>
                        <span class="collapse-icon">▼</span>
                    </div>
                    <div class="output-content active">
                        <div class="info-box">
                            <strong>Execution:</strong> Run these meta-prompts to generate fresh Chain/Bundle variations on-demand.
                        </div>
                        
                        <div class="prompt-card">
                            <div class="prompt-header">
                                <div>
                                    <div class="step-number">META-PROMPT: Chain Generator</div>
                                    <div class="prompt-meta">
                                        <span class="technique-tag">Prompt Inception</span>
                                    </div>
                                </div>
                            </div>
                            <div class="prompt-text">${escapeHtml(inception.chain)}</div>
                            <button class="copy-btn" onclick="copyPrompt(this, 200)">Copy Prompt</button>
                        </div>

                        <div class="prompt-card">
                            <div class="prompt-header">
                                <div>
                                    <div class="step-number">META-PROMPT: Bundle Generator</div>
                                    <div class="prompt-meta">
                                        <span class="technique-tag">Prompt Inception</span>
                                    </div>
                                </div>
                            </div>
                            <div class="prompt-text">${escapeHtml(inception.bundle)}</div>
                            <button class="copy-btn" onclick="copyPrompt(this, 201)">Copy Prompt</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleOutput(header) {
            const content = header.nextElementSibling;
            const icon = header.querySelector('.collapse-icon');
            
            content.classList.toggle('active');
            icon.classList.toggle('active');
        }

        function copyPrompt(button, index) {
            const promptText = button.previousElementSibling.textContent;
            
            // Try modern clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(promptText).then(() => {
                    showCopySuccess(button);
                }).catch(err => {
                    // Fallback to legacy method
                    fallbackCopy(promptText, button);
                });
            } else {
                // Use fallback directly if clipboard API not available
                fallbackCopy(promptText, button);
            }
        }

        function fallbackCopy(text, button) {
            // Create temporary textarea
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            
            // Select and copy
            textarea.focus();
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopySuccess(button);
                } else {
                    showCopyError(button);
                }
            } catch (err) {
                console.error('Fallback copy failed:', err);
                showCopyError(button);
            }
            
            // Clean up
            document.body.removeChild(textarea);
        }

        function showCopySuccess(button) {
            const originalText = button.textContent;
            button.textContent = '✓ Copied!';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        function showCopyError(button) {
            const originalText = button.textContent;
            button.textContent = '✗ Copy Failed';
            button.style.background = 'var(--accent-red)';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = '';
            }, 2000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
